# Product harvester configuration. Copy to config.yaml and edit.
# ${VAR} values are read from the environment (/etc/harvester.env when run by systemd).

daily_total_limit: 300          # hard cap across all jobs per day

parallel_sites: 3               # sites scraped at the same time, one thread (and one Chrome) each. Each site
                                # still gets the same polite pace - this shortens a run, it does not add load
                                # on any site. ~500 MB RAM per browser site. 1 = one site after another.

schedule:
  runs_per_day: 5               # must match the systemd timer (deploy/harvester.timer); quota is split evenly

storage:
  dir: data                     # SQLite DB, images/, exports/, logs/, browser profiles/

politeness:                     # <- this section is what keeps your IP clean
  min_delay: 12                 # seconds between two requests to the SAME site (random in [min, max])
  max_delay: 35
  long_pause_every: 15          # after ~15 requests to a site, take a longer break...
  long_pause_seconds: [60, 180] # ...of 1-3 minutes
  max_requests_per_domain_per_day: 150
  respect_robots: true
  cooldown_hours: [6, 24, 72]   # first block signal -> 6h pause for that site, then 24h, then 72h

browser:
  mode: auto                    # auto: xvfb on Linux, visible window on macOS/Windows
                                # xvfb = real Chrome in a virtual display (no screen needed, hardest to detect)
                                # headless = Chrome --headless=new (lighter, easier to detect)
  restart_every: 40             # fresh browser after N pages

http:
  impersonate: chrome           # curl_cffi TLS/HTTP2 fingerprint

# Optional. Only needed for sites that block datacenter/VPS IP ranges (eBay, Amazon, some Cloudflare sites).
# Use residential or mobile proxies. Each site always gets the same proxy (a consistent "visitor").
proxies: []                     # shared proxies for every site (sticky per site) - usually leave empty and give
                                # only the sites that block the server a `proxy:` of their own (see jobs)
#  - http://user:pass@gate.provider.com:7000

stock:                          # where products go: the Stock API's Product Master (POST /products/bulk)
  url: ${STOCK_API_URL}         # empty = https://api-stock.vnyx.ai
  api_key: ${STOCK_API_KEY}     # one of Stock's PRICING_API_KEYS; without it nothing is sent
  auto_push: true               # push after every run (or by hand: harvester.py push)
  batch: 200                    # rows per call (Stock allows 500)

ebay:                           # free keys: https://developer.ebay.com/my/keys
  client_id: ${EBAY_CLIENT_ID}
  client_secret: ${EBAY_CLIENT_SECRET}
  marketplace: EBAY_US

jobs:
  # ~280 products/day (22 Nov 2026), ~200-250 of them created in Stock (unbranded / unknown brands are skipped).
  # Each run (5/day) takes per_day/5 of every job. Several categories per site so the search pages keep giving
  # new products day after day (one keyword's first pages run dry on relevance-sorted sites).
  # type: auto (default) -> eBay API if keys are set, Shopify JSON if the store is Shopify, else generic
  # fetch (generic only): auto (HTTP first, browser if data incomplete) | http | browser

  # --- Vinted (EU resale, brand + price + photos; no blocks so far): 60/day ---
  - name: vinted-jackets
    site: https://www.vinted.nl
    category: jacket
    per_day: 20

  - name: vinted-jeans
    site: https://www.vinted.nl
    category: jeans
    per_day: 15

  - name: vinted-sweaters
    site: https://www.vinted.nl
    category: sweater
    per_day: 15

  - name: vinted-dresses
    site: https://www.vinted.nl
    category: dress
    per_day: 10

  # --- Sellpy (EU resale, brand + up to 30 photos): 30/day ---
  - name: sellpy-jassen
    site: https://www.sellpy.nl
    category: jas
    per_day: 10

  - name: sellpy-jeans
    site: https://www.sellpy.nl
    category: jeans
    per_day: 10

  - name: sellpy-truien
    site: https://www.sellpy.nl
    category: trui
    per_day: 10

  # --- Pangaia (Shopify feed, one request = 250 products; whole catalogue, not one keyword): 30/day ---
  - name: pangaia-all
    site: https://pangaia.com
    category: ""                   # empty = every product in the store's feed
    per_day: 30

  # --- Vestiaire Collective (luxury resale; links read from the page data): 25/day ---
  - name: vestiaire-jackets
    site: https://www.vestiairecollective.com
    category: jacket
    per_day: 10

  - name: vestiaire-coats
    site: https://www.vestiairecollective.com
    category: coat
    per_day: 8

  - name: vestiaire-knitwear
    site: https://www.vestiairecollective.com
    category: sweater
    per_day: 7

  # --- Poshmark (US resale, USD, brand + many photos): 25/day ---
  - name: poshmark-jackets
    site: https://poshmark.com
    category: jacket
    per_day: 10

  - name: poshmark-jeans
    site: https://poshmark.com
    category: jeans
    per_day: 8

  - name: poshmark-sweaters
    site: https://poshmark.com
    category: sweater
    per_day: 7

  # --- Depop (resale; plain requests get 403, the browser gets through): 20/day ---
  - name: depop-jackets
    site: https://www.depop.com
    category: jacket
    per_day: 10

  - name: depop-jeans
    site: https://www.depop.com
    category: jeans
    per_day: 10

  # --- Zalando (NEW items -> retail prices, a reference for Stock): 20/day ---
  - name: zalando-jassen
    site: https://www.zalando.nl
    category: jas
    per_day: 10
    search_url: "https://www.zalando.nl/catalogus/?q={query}&p={page}"

  - name: zalando-jeans
    site: https://www.zalando.nl
    category: jeans
    per_day: 10
    search_url: "https://www.zalando.nl/catalogus/?q={query}&p={page}"

  # --- Kleinanzeigen (DE classifieds; brand often only in the title): 20/day ---
  - name: kleinanzeigen-jacken
    site: https://www.kleinanzeigen.de
    category: jacke
    per_day: 10

  - name: kleinanzeigen-jeans
    site: https://www.kleinanzeigen.de
    category: jeans
    per_day: 10

  # --- Grailed (bot check after ~30 requests at the default pace -> slow, both jobs share this pace): 15/day ---
  - name: grailed-jackets
    site: https://www.grailed.com
    category: jacket
    per_day: 8
    fetch: browser
    politeness: {min_delay: 40, max_delay: 90, long_pause_every: 8, max_requests_per_domain_per_day: 40}

  - name: grailed-denim
    site: https://www.grailed.com
    category: denim
    per_day: 7
    fetch: browser

  # --- classifieds without a brand field: only listings whose title names a Brand Master brand reach Stock ---
  - name: marktplaats-jassen
    site: https://www.marktplaats.nl
    category: jas
    per_day: 8

  - name: marktplaats-spijkerbroeken
    site: https://www.marktplaats.nl
    category: spijkerbroek
    per_day: 7

  - name: 2dehands-jassen
    site: https://www.2dehands.be
    category: jas
    per_day: 10

  - name: subito-giacche
    site: https://www.subito.it
    category: giacca
    per_day: 10

  # --- these block the SERVER'S IP (a Google Cloud datacenter address) - no browser setting gets past that.
  #     Each needs a residential proxy (`proxy:` below; only that site uses it, ~$3-8/GB, ~$0.01-0.04/product)
  #     or the site's official API. Off until then.
  - name: etsy-vintage-jackets     # DataDome: "Automated (bot) activity on your network (IP ...)". Etsy also has
    site: https://www.etsy.com     #   an official API (Open API v3, free key) - the better route for Etsy.
    category: vintage jacket
    per_day: 10
    enabled: false
    # proxy: ${RESIDENTIAL_PROXY}

  - name: mercari-jackets          # Cloudflare: 403 Forbidden (US marketplace, USD prices)
    site: https://www.mercari.com
    category: jacket
    per_day: 10
    enabled: false
    # proxy: ${RESIDENTIAL_PROXY}

  - name: thredup-jackets          # Cloudflare: 403 for HTTP and browser
    site: https://www.thredup.com
    category: jacket
    per_day: 10
    enabled: false
    # proxy: ${RESIDENTIAL_PROXY}

  - name: wallapop-chaquetas       # 403 for HTTP and browser
    site: https://es.wallapop.com
    category: chaqueta
    per_day: 10
    enabled: false
    # proxy: ${RESIDENTIAL_PROXY}

  # --- not scrapable this way ---
  - name: tise-jakker              # app-style site: product links are not in the page
    site: https://tise.com
    category: jakke
    per_day: 10
    enabled: false
  # Vide Dressing: merged into Vinted (2022); its domain no longer serves a valid certificate - dropped.

  # - name: ebay-jackets           # eBay blocks server IPs - needs the official API keys (EBAY_CLIENT_ID/SECRET)
  #   site: https://www.ebay.com
  #   category: jacket
  #   per_day: 40
  #   type: ebay_api
